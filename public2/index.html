<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>タスク管理テスト画面</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .task-item { background: #f0f0f0; padding: 10px; margin: 5px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>タスク管理（動作確認用）</h1>
    
    <input type="text" id="taskTitle" placeholder="新しいタスクを入力">
    <button onclick="addTask()">追加</button>

    <h2>現在のタスク一覧</h2>
    <div id="taskList"></div>

    <script>
        // 一覧を取得して画面に表示する関数
        async function loadTasks() {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            const listDiv = document.getElementById('taskList');
            listDiv.innerHTML = '';
            
            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerText = `${task.id}: ${task.title} (${new Date(task.created_at).toLocaleString()})`;
                listDiv.appendChild(div);
            });
        }

        // タスクを追加する関数
        async function addTask() {
            const titleInput = document.getElementById('taskTitle');
            const title = titleInput.value;
            if (!title) return alert('文字を入力してください');

            await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            titleInput.value = '';
            loadTasks(); // 一覧を再読み込み
        }

        // ページを開いた時に一覧を表示
        loadTasks();
    </script>
</body>
</html>
